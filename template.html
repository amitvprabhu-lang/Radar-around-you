<title>Radar Around You</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#04060c">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Hanken+Grotesk:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* This is a night-sky app, so it stays dark in both colour schemes. */
  :root {
    --ink: #04060c; --ink-2: #0a0f1c; --panel: rgba(10, 14, 27, .74); --panel-solid: #0d1322; --line: rgba(160, 185, 255, .14); --line-2: rgba(160, 185, 255, .28);
    --text: #eaf0ff; --muted: #9aa7c7; --dim: #6c7794;
    --ion: #62e6c3; --ember: #ffad6b; --aurora: #7dffa8; --violet: #a98cff; --signal: #ffd166; --alert: #ff6b7a; --sky: #6fb4ff;
    --radius: 18px; --safe-b: env(safe-area-inset-bottom, 0px); --safe-t: env(safe-area-inset-top, 0px);
    --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif; --f-body: "Hanken Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif; --f-mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    color-scheme: dark;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { color-scheme: dark; } }
  :root[data-theme="dark"] { color-scheme: dark; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--ink); color: var(--text); font: 400 15px/1.45 var(--f-body); overflow: hidden; overscroll-behavior: none; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  [hidden] { display: none !important; }
  #app { position: fixed; inset: 0; background: radial-gradient(120% 90% at 50% 40%, #0a1226 0%, var(--ink) 70%); touch-action: none; user-select: none; -webkit-user-select: none; }
  canvas#gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }
  /* Sky Lens: the camera picture sits behind the canvas; a screen blend lets its dark parts show the camera and its bright parts add to it */
  video#lens { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: none; background: #000; }
  body[data-lens="on"] video#lens { display: block; }
  body[data-lens="on"] canvas#gl { mix-blend-mode: screen; }
  .glass { background: var(--panel); border: 1px solid var(--line); backdrop-filter: blur(16px) saturate(1.25); -webkit-backdrop-filter: blur(16px) saturate(1.25); }
  .mono { font-family: var(--f-mono); }
  :focus-visible { outline: 2px solid var(--ion); outline-offset: 2px; }

  /* ---- top area ---- */
  .top { position: absolute; top: calc(10px + var(--safe-t)); left: 16px; right: 16px; display: flex; align-items: center; gap: 8px; z-index: 6; pointer-events: none; }
  .top > * { pointer-events: auto; }
  .brand { display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 13px 0 10px; border-radius: 22px; font: 700 14px/1 var(--f-display); letter-spacing: .01em; white-space: nowrap; cursor: pointer; }
  .brand svg { width: 22px; height: 22px; }
  .spacer { flex: 1; }
  .round { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; }
  .round svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .pill-btn { height: 44px; padding: 0 13px; border-radius: 22px; display: flex; align-items: center; gap: 8px; font: 500 11.5px/1 var(--f-mono); letter-spacing: .03em; white-space: nowrap; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ion); box-shadow: 0 0 10px var(--ion); animation: blink 2.4s ease-in-out infinite; }
  .dot.sim { background: var(--signal); box-shadow: 0 0 10px var(--signal); }
  .dot.bad { background: var(--alert); box-shadow: 0 0 10px var(--alert); }
  .feedrow { padding: 12px 0 4px; border-top: 1px solid var(--line); }
  .frow-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 4px; }
  .statepill { flex: none; padding: 4px 9px; border-radius: 10px; font: 500 11px/1 var(--f-mono); letter-spacing: .03em; background: rgba(160, 185, 255, .12); color: var(--muted); }
  .statepill.fresh { background: rgba(98, 230, 195, .14); color: var(--ion); }
  .statepill.failing, .statepill.stale { background: rgba(255, 209, 102, .15); color: var(--signal); }
  .statepill.halted { background: rgba(255, 107, 122, .15); color: var(--alert); }
  .statepill.none { background: rgba(255, 209, 102, .15); color: var(--signal); }
  .note.warn { color: var(--signal); }
  /* around you, aurora, storms and fires */
  .placeinput { width: 100%; height: 44px; margin: 6px 0 10px; padding: 0 14px; border-radius: 14px; border: 1px solid var(--line-2); background: rgba(255, 255, 255, .05); color: var(--text); font: 400 15px var(--f-body); }
  .placeinput:focus { outline: 2px solid color-mix(in srgb, var(--ion) 60%, transparent); outline-offset: 1px; }
  #nightveil { position: fixed; inset: 0; z-index: 9999; pointer-events: none; display: none; background: rgb(255, 24, 0); mix-blend-mode: multiply; }
  html.night #nightveil { display: block; }
  .linkbtn { background: none; border: 0; padding: 0; color: var(--ion); font: inherit; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; text-align: left; }
  button.item { width: 100%; text-align: left; color: inherit; font: inherit; cursor: pointer; }
  .item.near { border-left: 3px solid var(--line-2); align-items: flex-start; }
  .item.near.alert { border-left-color: var(--alert); } .item.near.watch { border-left-color: var(--signal); } .item.near.info { border-left-color: var(--sky); }
  .item.near.here { background: rgba(125, 255, 168, .07); border-color: color-mix(in srgb, var(--aurora) 45%, transparent); }
  .item.near .grow { min-width: 0; } .item.near .s { display: block; margin-top: 3px; color: var(--muted); font-size: 13px; line-height: 1.4; }
  .kpbox { display: flex; align-items: center; gap: 16px; margin: 12px 0 8px; padding: 14px; border-radius: 16px; border: 1px solid var(--line); background: rgba(125, 255, 168, .05); }
  .kpnum { display: grid; text-align: center; flex: none; } .kpnum b { font: 700 40px/1 var(--f-display); color: var(--aurora); } .kpnum span { font: 400 11px var(--f-mono); color: var(--muted); letter-spacing: .06em; text-transform: uppercase; }
  .kpbar { display: grid; grid-template-columns: repeat(9, 1fr); gap: 3px; } .kpbar i { height: 12px; border-radius: 3px; background: rgba(160, 185, 255, .14); }
  .kpbar i.on { background: var(--aurora); box-shadow: 0 0 8px rgba(125, 255, 168, .5); } .kpbar i.on.g { background: var(--signal); box-shadow: 0 0 8px rgba(255, 209, 102, .5); }
  .kpnote { margin: 8px 0 0; font-size: 13px; line-height: 1.4; color: var(--muted); }
  .wchart { margin: 10px 0 0; } .wchart figcaption { font: 400 11px var(--f-mono); color: var(--dim); letter-spacing: .04em; margin-bottom: 4px; }
  .wchart svg { width: 100%; height: 70px; display: block; border-radius: 10px; background: rgba(255, 255, 255, .03); border: 1px solid var(--line); }
  .wchart .line { fill: none; stroke: var(--aurora); stroke-width: 1.6; vector-effect: non-scaling-stroke; } .wchart .zero { stroke: var(--line-2); stroke-dasharray: 3 3; vector-effect: non-scaling-stroke; }
  .wchart .fillneg { fill: rgba(255, 107, 122, .18); stroke: none; }
  .stormcard { margin: 14px 0 0; padding: 12px; border-radius: 16px; border: 1px solid var(--line); background: rgba(255, 255, 255, .03); }
  .stormhead { display: flex; align-items: flex-start; gap: 10px; } .stormhead b { display: block; font: 600 16px var(--f-display); } .stormhead .s { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }
  .stormmap { width: 100%; height: auto; display: block; margin: 10px 0 0; border-radius: 12px; border: 1px solid var(--line); }
  .stormmap .sea { fill: #08111f; } .stormmap .coast { fill: none; stroke: rgba(160, 185, 255, .42); stroke-width: .8; }
  .stormmap .cone { fill: rgba(111, 180, 255, .16); stroke: rgba(111, 180, 255, .55); stroke-width: .8; } .stormmap .track { fill: none; stroke: var(--text); stroke-width: 1.2; stroke-dasharray: 4 3; }
  .stormmap .grid { stroke: rgba(160, 185, 255, .14); stroke-width: .6; } .stormmap .glabel { font: 400 7px var(--f-mono); fill: var(--dim); }
  .stormmap .flabel { font: 500 8px var(--f-mono); fill: var(--muted); } .stormmap .flabel.you { fill: var(--aurora); font-weight: 600; }
  .stormmap .now { stroke: #fff; stroke-width: 1.6; } .stormmap .you { fill: var(--aurora); stroke: #04060c; stroke-width: 1.2; } .stormmap .fpt { stroke: #04060c; stroke-width: .8; }

  .mono.small { font-size: 12px; color: var(--muted); }
  @keyframes blink { 50% { opacity: .35; } }

  .subtop { position: absolute; top: calc(62px + var(--safe-t)); left: 16px; right: 16px; z-index: 5; display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
  .subtop > * { pointer-events: auto; }
  .chip { display: inline-flex; align-items: center; gap: 7px; height: 36px; padding: 0 13px; border-radius: 18px; font: 500 13px/1 var(--f-body); white-space: nowrap; color: var(--text); }
  .chip svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  .place { align-self: flex-start; }
  .chips-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .tonight { color: var(--signal); border-color: rgba(255, 209, 102, .35); }
  .tonight[data-level="excellent"], .tonight[data-level="good"] { color: var(--ion); border-color: rgba(98, 230, 195, .4); }
  .tonight[data-level="poor"] { color: var(--muted); }
  .place small { color: var(--muted); font-weight: 400; }
  .chip[aria-pressed="true"] { border-color: color-mix(in srgb, var(--c, var(--ion)) 55%, transparent); color: var(--c, var(--ion)); background: color-mix(in srgb, var(--c, var(--ion)) 14%, var(--panel-solid)); }
  .chip[aria-pressed="false"] { color: var(--muted); }
  .chip .sw { width: 9px; height: 9px; border-radius: 50%; background: var(--c, var(--ion)); box-shadow: 0 0 8px var(--c, var(--ion)); }
  .chip[aria-pressed="false"] .sw { opacity: .35; box-shadow: none; }
  .scroller { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding: 2px 0; margin: 0 -16px; padding-left: 16px; padding-right: 16px; }
  .scroller::-webkit-scrollbar { display: none; }
  .stat { flex: none; padding: 7px 12px 8px; border-radius: 14px; min-width: 84px; text-align: left; }
  .stat b { display: block; font: 700 18px/1.1 var(--f-display); letter-spacing: -.01em; }
  .stat span { display: block; font: 400 11px/1.3 var(--f-body); color: var(--muted); }

  /* ---- layers ---- */
  .layers { position: absolute; left: 16px; right: 16px; bottom: calc(76px + var(--safe-b)); z-index: 5; }
  .hud { position: absolute; left: 16px; right: 16px; bottom: calc(76px + var(--safe-b)); z-index: 5; display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
  .hud > * { pointer-events: auto; }
  .hud-top { position: absolute; left: 16px; right: 16px; top: calc(106px + var(--safe-t)); z-index: 5; display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
  .hud-top > * { pointer-events: auto; }
  .panel { border-radius: var(--radius); padding: 12px 14px; }
  .panel h3 { margin: 0 0 4px; font: 700 15px/1.2 var(--f-display); }
  .panel p { margin: 0; color: var(--muted); font-size: 13px; }
  .row { display: flex; align-items: center; gap: 10px; }
  .row.wrap { flex-wrap: wrap; }
  .grow { flex: 1; min-width: 0; }
  input[type="range"] { -webkit-appearance: none; appearance: none; width: 100%; height: 28px; background: transparent; touch-action: none; }
  input[type="range"]::-webkit-slider-runnable-track { height: 4px; border-radius: 2px; background: linear-gradient(90deg, var(--ion), var(--violet)); opacity: .7; }
  input[type="range"]::-moz-range-track { height: 4px; border-radius: 2px; background: linear-gradient(90deg, var(--ion), var(--violet)); opacity: .7; }
  input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 22px; height: 22px; margin-top: -9px; border-radius: 50%; background: #fff; border: 0; box-shadow: 0 0 0 4px rgba(98, 230, 195, .35); }
  input[type="range"]::-moz-range-thumb { width: 22px; height: 22px; border-radius: 50%; background: #fff; border: 0; box-shadow: 0 0 0 4px rgba(98, 230, 195, .35); }
  .btn { height: 42px; padding: 0 16px; border-radius: 21px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; font: 600 14px/1 var(--f-body); border: 1px solid var(--line-2); background: rgba(255, 255, 255, .04); text-decoration: none; color: var(--text); white-space: nowrap; }
  .btn.primary { background: var(--ion); color: #031210; border-color: transparent; }
  .btn.warn { background: var(--signal); color: #1a1200; border-color: transparent; }
  .btn svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
  .btn.small { height: 34px; padding: 0 12px; font-size: 13px; }
  /* on a phone the sky panel has four buttons (Sensors, Camera, Guide, More); tighter ones keep them on one line */
  @media (max-width: 440px) { .hudhead { flex: 1 1 100% !important; } .hudbtns { gap: 4px !important; } .hudbtns .btn.small { padding: 0 9px; font-size: 12px; } }
  .tag { display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: 11px; font: 500 11px/1 var(--f-mono); letter-spacing: .03em; background: rgba(255, 255, 255, .07); color: var(--muted); }
  .tag.new { background: rgba(255, 209, 102, .16); color: var(--signal); }
  .tag.live { background: rgba(98, 230, 195, .15); color: var(--ion); }
  .tag.warn { background: rgba(255, 107, 122, .16); color: var(--alert); }

  /* ---- tabs ---- */
  .tabs { position: absolute; left: 16px; right: 16px; bottom: calc(10px + var(--safe-b)); z-index: 10; height: 58px; border-radius: 29px; display: grid; grid-template-columns: repeat(4, 1fr); padding: 5px; gap: 4px; }
  .tab { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; border-radius: 24px; color: var(--muted); font: 500 11px/1 var(--f-body); letter-spacing: .02em; transition: background .2s, color .2s; }
  .tab svg { width: 21px; height: 21px; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  .tab[aria-selected="true"] { background: rgba(98, 230, 195, .14); color: var(--ion); }
  .tab .badge { position: absolute; margin: -22px 0 0 22px; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 8px; background: var(--signal); color: #1a1200; font: 600 10px/16px var(--f-mono); text-align: center; }

  /* ---- detail card ---- */
  .card { position: absolute; left: 16px; right: 16px; bottom: calc(76px + var(--safe-b)); z-index: 8; max-height: min(62vh, 560px); overflow: auto; border-radius: 22px; padding: 14px 16px 16px; background: rgba(9, 13, 25, .9); animation: rise .28s cubic-bezier(.2, .8, .2, 1); overscroll-behavior: contain; touch-action: pan-y; }
  @keyframes rise { from { transform: translateY(24px); opacity: 0; } }
  .card-head { display: flex; align-items: flex-start; gap: 10px; }
  .card-head .grow { padding-top: 2px; }
  .kicker { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 6px; }
  .card.collapsed { max-height: none; }
  .card h2 { margin: 0; font: 700 21px/1.15 var(--f-display); letter-spacing: -.01em; }
  .card .sub { margin: 3px 0 0; color: var(--muted); font-size: 13.5px; }
  .x { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; color: var(--muted); border: 1px solid var(--line); flex: none; }
  .x svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; }
  dl.facts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 14px; margin: 14px 0 4px; }
  dl.facts div { min-width: 0; }
  dl.facts dt { font: 400 11px/1.2 var(--f-body); color: var(--dim); text-transform: uppercase; letter-spacing: .07em; }
  dl.facts dd { margin: 2px 0 0; font: 500 14px/1.3 var(--f-body); overflow-wrap: anywhere; }
  dl.facts dd.mono { font-family: var(--f-mono); font-size: 13px; }
  dl.facts .wide { grid-column: 1 / -1; }
  .card.collapsed dl.facts, .card.collapsed .note, .card.collapsed .bars, .card.collapsed .route, .card.collapsed input[type=range], .card.collapsed .row { display: none; }
  .card .fold svg { transition: transform .2s; }
  .card.collapsed .fold svg { transform: rotate(180deg); }
  .card-head .x + .x { margin-left: 2px; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
  .note { margin: 10px 0 0; color: var(--dim); font-size: 12px; line-height: 1.4; }
  .meter { height: 8px; border-radius: 4px; background: rgba(255, 255, 255, .08); overflow: hidden; position: relative; }
  .meter i { position: absolute; inset: 0 auto 0 0; border-radius: 4px; background: linear-gradient(90deg, var(--ion), var(--sky)); }
  .route { display: flex; align-items: center; gap: 10px; margin: 12px 0 2px; }
  .route .code { font: 700 18px/1 var(--f-display); }
  .route small { display: block; color: var(--muted); font: 400 11px/1.2 var(--f-body); max-width: 92px; }
  .route .track { flex: 1; position: relative; height: 22px; }
  .route .track::before { content: ""; position: absolute; left: 0; right: 0; top: 10px; border-top: 2px dashed var(--line-2); }
  .route .track .fill { position: absolute; left: 0; top: 10px; height: 2px; background: var(--ion); box-shadow: 0 0 8px var(--ion); }
  .route .track svg { position: absolute; top: 1px; width: 20px; height: 20px; margin-left: -10px; fill: var(--text); transform: rotate(90deg); }
  .bars { display: grid; gap: 5px; margin-top: 8px; }
  .bars .bar { display: grid; grid-template-columns: 74px 1fr 78px; align-items: center; gap: 8px; font: 400 12px/1 var(--f-mono); color: var(--muted); }
  .bars .bar .meter i { background: var(--c, var(--ember)); }

  /* ---- labels over the canvas ---- */
  #labels { position: absolute; inset: 0; pointer-events: none; z-index: 2; overflow: hidden; }
  .lbl { position: absolute; left: 0; top: 0; transform: translate(-50%, -100%); white-space: nowrap; font: 500 11px/1 var(--f-mono); letter-spacing: .06em; color: #fff; text-shadow: 0 0 6px #000, 0 0 2px #000; opacity: .92; will-change: transform; }
  .lbl.cardinal { color: var(--muted); font-size: 12px; letter-spacing: .12em; }
  .lbl.body { color: #ffe9b0; }
  .lbl.con { color: #f2c98b; font-size: 10px; letter-spacing: .14em; text-transform: uppercase; opacity: .78; text-shadow: 0 0 6px #000; }
  .lbl.star { color: #b9c9f5; font-size: 10px; opacity: .8; }
  .lbl.plane { color: #bfe6ff; padding: 8px 6px; margin: -8px -6px; }
  .lbl.you { color: var(--ion); }
  .lbl.sel { color: var(--signal); font-size: 12px; background: rgba(8, 11, 20, .7); border: 1px solid rgba(255, 209, 102, .4); padding: 5px 8px; border-radius: 9px; text-shadow: none; }
  .lbl.layer { color: rgba(30, 14, 4, .85); text-shadow: 0 0 5px rgba(255, 220, 160, .6); font-weight: 600; transform: translate(-50%, -50%); }
  .lbl.layer.out { color: var(--muted); text-shadow: 0 0 6px #000, 0 0 2px #000; }
  .lbl.focus { color: #fff; }
  .lbl.epi { color: var(--ember); }

  /* ---- guide me ---- */
  #guide { position: absolute; left: 16px; right: 16px; top: calc(106px + var(--safe-t)); z-index: 7; border-radius: var(--radius); padding: 12px 14px; display: flex; align-items: center; gap: 14px; }
  #guide .arrow { width: 54px; height: 54px; flex: none; display: grid; place-items: center; }
  #guide .arrow svg { width: 44px; height: 44px; fill: var(--signal); transition: transform .12s linear; filter: drop-shadow(0 0 8px rgba(255, 209, 102, .6)); }
  #guide b { display: block; font: 700 16px/1.2 var(--f-display); }
  #guide span { color: var(--muted); font-size: 13px; }
  #guide.found .arrow svg { fill: var(--ion); }

  /* ---- search and sheets ---- */
  .search { position: absolute; inset: 0; z-index: 20; background: rgba(3, 5, 10, .86); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); padding: calc(10px + var(--safe-t)) 16px 12px; display: flex; flex-direction: column; gap: 10px; touch-action: pan-y; }
  .search form { display: flex; gap: 8px; }
  .search input[type="search"] { flex: 1; min-width: 0; height: 48px; border-radius: 24px; border: 1px solid var(--line-2); background: rgba(255, 255, 255, .06); color: var(--text); padding: 0 18px; font: 500 16px var(--f-body); outline: none; }
  .search input[type="search"]:focus { border-color: var(--ion); }
  .results { overflow: auto; flex: 1; display: flex; flex-direction: column; gap: 6px; padding-bottom: 20px; }
  .results h4 { margin: 12px 4px 2px; font: 500 11px/1 var(--f-mono); letter-spacing: .12em; color: var(--dim); text-transform: uppercase; }
  .result { display: flex; align-items: center; gap: 12px; padding: 11px 12px; border-radius: 14px; text-align: left; border: 1px solid var(--line); background: rgba(255, 255, 255, .03); width: 100%; }
  .result:hover, .result:focus-visible { border-color: var(--line-2); background: rgba(255, 255, 255, .07); }
  .result .ico { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; flex: none; background: rgba(98, 230, 195, .12); color: var(--ion); font: 700 12px var(--f-mono); }
