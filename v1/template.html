<title>Radar Around You</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one full-screen instrument. A live canvas fills the screen; a place bar sits on top,
   a lens switcher and one action card sit at the bottom. Committed dark "night instrument" look. */
:root {
  --space: #04060c;
  --deep: #0a0f1e;
  --panel: rgba(12, 18, 36, 0.86);
  --panel-solid: #0e1528;
  --line: rgba(150, 175, 255, 0.16);
  --line-strong: rgba(150, 175, 255, 0.32);
  --text: #e9edf8;
  --muted: #95a1c2;
  --faint: #5e6a8c;
  --above: #7cd4ff;
  --tonight: #93efc6;
  --under: #ffb46e;
  --world: #c7b4ff;
  --caution: #ffd27a;
  --lens: var(--above);
  --display: "Syne", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body: "Instrument Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --data: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r-sm: 8px;
  --r-md: 14px;
  color-scheme: dark;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body {
  background: var(--space);
  color: var(--text);
  font-family: var(--body);
  font-size: 15px;
  line-height: 1.45;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}
body[data-lens="above"] { --lens: var(--above); }
body[data-lens="tonight"] { --lens: var(--tonight); }
body[data-lens="under"] { --lens: var(--under); }
body[data-lens="world"], body[data-lens="arrival"] { --lens: var(--world); }

#stage { position: fixed; inset: 0; background: var(--space); }
#stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; transition: opacity 700ms ease, transform 900ms cubic-bezier(.2,.7,.2,1); }
#globe { touch-action: none; }
#sky { touch-action: pan-y; }
.is-hidden { opacity: 0; pointer-events: none; }
#sky.is-hidden { transform: scale(.88); }
#labels { position: absolute; inset: 0; pointer-events: none; }
.tag {
  position: absolute; transform: translate(10px, -50%);
  font: 500 11px/1 var(--data); letter-spacing: .02em; color: var(--text);
  background: rgba(4, 6, 12, .6); border: 1px solid var(--line); border-radius: 4px; padding: 3px 5px;
  white-space: nowrap;
}
.tag.you { color: var(--lens); border-color: var(--lens); }

/* Top bar */
.topbar {
  position: fixed; left: 0; right: 0; top: 0; z-index: 5;
  padding: calc(env(safe-area-inset-top, 0px) + 12px) 16px 0;
  display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;
  pointer-events: none;
}
.topbar > * { pointer-events: auto; }
.place {
  display: flex; flex-direction: column; align-items: flex-start; gap: 2px;
  background: none; border: 0; color: var(--text); cursor: pointer; padding: 0; text-align: left;
}
.place-name { font: 700 22px/1.05 var(--display); letter-spacing: -.01em; display: flex; align-items: center; gap: 6px; }
.place-name svg { opacity: .7; }
.place-meta { font: 400 12px/1.3 var(--data); color: var(--muted); }
.top-actions { display: flex; gap: 8px; }
.chip {
  font: 500 12px/1 var(--body); color: var(--text);
  background: var(--panel); border: 1px solid var(--line); border-radius: 999px;
  padding: 8px 12px; cursor: pointer; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
}
.chip:hover { border-color: var(--line-strong); }

.headline {
  position: fixed; left: 16px; right: 16px; z-index: 4; pointer-events: none;
  top: calc(env(safe-area-inset-top, 0px) + 72px);
  max-width: 34ch;
}
.headline h1 {
  margin: 0; font: 700 clamp(19px, 5.2vw, 28px)/1.12 var(--display); letter-spacing: -.015em;
  text-wrap: balance; text-shadow: 0 2px 18px rgba(0,0,0,.6);
}
.headline h1 em { font-style: normal; color: var(--lens); font-variant-numeric: tabular-nums; }
.headline p { margin: 6px 0 0; font: 400 12px/1.35 var(--data); color: var(--muted); text-shadow: 0 1px 8px rgba(0,0,0,.8); }

/* Live stats strip (globe home) */
.stats {
  position: fixed; left: 16px; right: 16px; z-index: 4;
  top: calc(env(safe-area-inset-top, 0px) + 66px);
  display: grid; grid-template-columns: repeat(4, minmax(0, 1fr));
  background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-md);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  max-width: 560px;
}
.stat { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 9px 4px 8px; min-width: 0; }
.stat + .stat { border-left: 1px solid var(--line); }
.stat .k { font: 500 9.5px/1 var(--data); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
.stat .v { font: 700 21px/1 var(--display); color: var(--text); font-variant-numeric: tabular-nums; }
.stat .v.hot { color: var(--under); }
.stat .v.accent { color: var(--tonight); }
.stat .s { font: 400 9.5px/1.1 var(--data); color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
body[data-lens="world"] .headline { top: calc(env(safe-area-inset-top, 0px) + 136px); }
body[data-lens="world"] .headline h1 { font-size: clamp(18px, 4.8vw, 25px); }

.chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding: 2px 0; }
.chips::-webkit-scrollbar { display: none; }
.chip-toggle {
  flex: 0 0 auto; display: inline-flex; align-items: center; gap: 7px;
  font: 500 12.5px/1 var(--body); color: var(--muted); background: var(--panel);
  border: 1px solid var(--line); border-radius: 999px; padding: 8px 12px; cursor: pointer;
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
}
.chip-toggle i { width: 8px; height: 8px; border-radius: 50%; background: var(--dot, var(--muted)); opacity: .45; }
.chip-toggle[aria-pressed="true"] { color: var(--text); border-color: var(--line-strong); }
.chip-toggle[aria-pressed="true"] i { opacity: 1; box-shadow: 0 0 8px var(--dot); }
.chip-toggle:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }

/* Bottom dock */
.dock {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 6;
  padding: 0 12px calc(env(safe-area-inset-bottom, 0px) + 12px);
  display: flex; flex-direction: column; align-items: center; gap: 10px; pointer-events: none;
}
.dock > * { pointer-events: auto; width: 100%; max-width: 520px; }
.card {
  background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-md);
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  padding: 14px 14px 12px; display: flex; flex-direction: column; gap: 10px;
  box-shadow: 0 10px 40px rgba(0,0,0,.45);
}
.card-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.card-kicker { font: 500 11px/1 var(--data); letter-spacing: .08em; text-transform: uppercase; color: var(--lens); }
.card-src { font: 400 11px/1 var(--data); color: var(--faint); white-space: nowrap; }
.card h2 { margin: 0; font: 600 18px/1.25 var(--body); text-wrap: balance; }
.card .detail { margin: 0; color: var(--muted); font-size: 13.5px; }
.card .mono { font-family: var(--data); font-size: 12.5px; color: var(--text); font-variant-numeric: tabular-nums; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
.btn {
  font: 600 13.5px/1 var(--body); border-radius: 999px; padding: 10px 14px; cursor: pointer;
  border: 1px solid var(--lens); color: var(--lens); background: transparent; text-decoration: none;
  display: inline-flex; align-items: center; gap: 6px;
}
.btn.primary { background: var(--lens); color: #061020; }
.btn:focus-visible, .chip:focus-visible, .tab:focus-visible, .place:focus-visible, .sheet button:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
.timeline { display: flex; gap: 2px; height: 22px; align-items: stretch; }
.timeline .slot { flex: 1; border-radius: 3px; background: var(--deep); position: relative; min-width: 0; }
.timeline .slot.best { outline: 1.5px solid var(--lens); outline-offset: -1.5px; }
.timeline-labels { display: flex; justify-content: space-between; font: 400 10.5px/1 var(--data); color: var(--faint); }
.slider-row { display: flex; align-items: center; gap: 10px; }
.slider-row input { flex: 1; accent-color: var(--lens); min-width: 0; }
.slider-row output { font: 500 12px/1 var(--data); color: var(--text); min-width: 7ch; text-align: right; }
.note { font: 400 11px/1.35 var(--data); color: var(--faint); margin: 0; }

.tabs {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px;
  background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 4px;
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
}
.tab {
  display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 7px 4px 6px;
  background: none; border: 0; border-radius: 999px; color: var(--muted); cursor: pointer;
  font: 600 11.5px/1 var(--body); letter-spacing: .02em;
}
.tab svg { width: 18px; height: 18px; }
.tab[aria-selected="true"] { color: #061020; background: var(--lens); }

/* Sheets */
.sheet-backdrop { position: fixed; inset: 0; z-index: 20; background: rgba(2,4,10,.6); display: flex; align-items: flex-end; justify-content: center; }
.sheet {
  width: 100%; max-width: 560px; max-height: 82%; overflow: auto;
  background: var(--panel-solid); border: 1px solid var(--line); border-radius: 18px 18px 0 0;
  padding: 18px 16px calc(env(safe-area-inset-bottom, 0px) + 18px);
}
.sheet h3 { margin: 0 0 4px; font: 700 20px/1.2 var(--display); }
.sheet p { color: var(--muted); margin: 6px 0; font-size: 13.5px; }
.sheet ul { list-style: none; margin: 10px 0 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.sheet li button, .sheet li a {
  width: 100%; text-align: left; display: flex; justify-content: space-between; gap: 10px; align-items: baseline;
  background: var(--deep); color: var(--text); border: 1px solid var(--line); border-radius: var(--r-sm);
  padding: 11px 12px; font: 500 14px/1.3 var(--body); cursor: pointer; text-decoration: none;
}
.sheet li .r { font: 400 12px/1.3 var(--data); color: var(--muted); text-align: right; }
.sheet .close { margin-top: 14px; }
.sheet dl { display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; margin: 12px 0 0; }
.sheet dt { font: 600 13px/1.3 var(--body); }
.sheet dd { margin: 2px 0 0; font: 400 12px/1.4 var(--data); color: var(--muted); }
.sheet a { color: var(--lens); }

/* Guide me */
.guide { position: fixed; inset: 0; z-index: 30; background: var(--space); display: flex; flex-direction: column; }
.guide canvas { flex: 1; width: 100%; min-height: 0; touch-action: none; cursor: grab; }
.guide-top { position: absolute; left: 16px; right: 16px; top: calc(env(safe-area-inset-top, 0px) + 14px); display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; pointer-events: none; }
.guide-top > * { pointer-events: auto; }
.guide-say { font: 700 clamp(20px, 5.6vw, 30px)/1.15 var(--display); max-width: 22ch; text-wrap: balance; text-shadow: 0 2px 14px rgba(0,0,0,.7); }
.guide-say small { display: block; font: 400 12px/1.4 var(--data); color: var(--muted); margin-top: 8px; }
.guide-bottom { position: absolute; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom, 0px) + 16px); display: flex; justify-content: center; gap: 10px; padding: 0 16px; }

.toast {
  position: fixed; left: 50%; transform: translateX(-50%); z-index: 40;
  bottom: calc(env(safe-area-inset-bottom, 0px) + 150px);
  background: var(--panel-solid); border: 1px solid var(--line-strong); border-radius: 999px; padding: 9px 14px;
  font: 500 13px/1.2 var(--body);
}
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

@media (min-width: 900px) {
  .dock { align-items: flex-end; padding-right: 24px; }
  .headline { left: 24px; top: calc(env(safe-area-inset-top, 0px) + 88px); }
  .topbar { padding-left: 24px; padding-right: 24px; }
}
@media (max-height: 640px) {
  .headline p { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  #stage canvas { transition: none; }
}
</style>

<div id="stage" aria-hidden="true">
  <canvas id="globe"></canvas>
  <canvas id="sky" class="is-hidden"></canvas>
  <div id="labels"></div>
</div>

<header class="topbar">
  <button class="place" id="placeBtn" type="button" aria-haspopup="dialog">
    <span class="place-name"><span id="placeName">Pune</span>
      <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M3 5l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.6"/></svg></span>
    <span class="place-meta" id="placeMeta">Loading the sky</span>
  </button>
  <div class="top-actions">
    <button class="chip" id="listBtn" type="button">List</button>
    <button class="chip" id="aboutBtn" type="button">Sources</button>
  </div>
</header>

<section class="stats" id="stats" aria-label="Right now" hidden>
  <div class="stat"><span class="k">In orbit</span><span class="v" id="stOrbit">0</span><span class="s">tracked objects</span></div>
  <div class="stat"><span class="k">Above you</span><span class="v accent" id="stAbove">0</span><span class="s">satellites</span></div>
  <div class="stat"><span class="k">Kp now</span><span class="v" id="stKp">0</span><span class="s" id="stKpS"></span></div>
  <div class="stat"><span class="k">Quakes</span><span class="v" id="stQuakes">0</span><span class="s">M2.5+, 24 h</span></div>
</section>

<section class="headline" aria-live="polite">
  <h1 id="headline">Finding what is around you</h1>
  <p id="subline"></p>
</section>

<nav class="dock" aria-label="Radar">
  <div class="chips" id="chips" role="group" aria-label="Layers on the globe" hidden></div>
  <article class="card" id="card" aria-live="polite"></article>
  <div class="tabs" role="tablist" aria-label="Lenses">
    <button class="tab" role="tab" data-lens="world" aria-selected="false" type="button">
      <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="7" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M3 10h14M10 3c-3 3.5-3 10.5 0 14M10 3c3 3.5 3 10.5 0 14" fill="none" stroke="currentColor" stroke-width="1.3"/></svg>Globe</button>
    <button class="tab" role="tab" data-lens="above" aria-selected="false" type="button">
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 3l6 9H4z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M3 16h14" stroke="currentColor" stroke-width="1.6"/></svg>Above</button>
    <button class="tab" role="tab" data-lens="tonight" aria-selected="false" type="button">
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M13.5 3.5a6.5 6.5 0 1 0 3 9.9A5.2 5.2 0 0 1 13.5 3.5z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>Tonight</button>
    <button class="tab" role="tab" data-lens="under" aria-selected="false" type="button">
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M2 6h16M4 10h12M7 14h6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><circle cx="10" cy="16.5" r="1.4" fill="currentColor"/></svg>Under</button>
  </div>
</nav>

<div id="layer"></div>
